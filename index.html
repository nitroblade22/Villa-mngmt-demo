<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Management Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

header {
    background: #111827;
    color: white;
    padding: 24px;
}

header h1 {
    margin: 0 0 6px;
    font-size: 28px;
}

header p {
    margin: 0;
    color: #cbd5e1;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.stat h3 {
    margin: 0 0 8px;
    font-size: 14px;
    color: #64748b;
}

.stat strong {
    font-size: 28px;
}

/* =========================
   CONTROLS
========================= */

.controls {
    background: white;
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
    margin-bottom: 12px;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
}

button:hover {
    opacity: .9;
}

.btn-dark {
    background: #111827;
    color: white;
}

.btn-blue {
    background: #2563eb;
    color: white;
}

.btn-green {
    background: #16a34a;
    color: white;
}

.btn-red {
    background: #dc2626;
    color: white;
}

.btn-orange {
    background: #ea580c;
    color: white;
}

.btn-gray {
    background: #e5e7eb;
    color: #111827;
}

/* =========================
   VILLA
========================= */

.villa {
    background: white;
    border-radius: 16px;
    margin-bottom: 25px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.villa-header {
    background: #1e293b;
    color: white;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.villa-header h2 {
    margin: 0;
}

.villa-info {
    font-size: 13px;
    color: #cbd5e1;
    margin-top: 5px;
}

.villa-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.room {
    padding: 18px;
    border-bottom: 1px solid #e5e7eb;
}

.room:last-child {
    border-bottom: 0;
}

.room-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
}

.room-header h3 {
    margin: 0;
    font-size: 18px;
}

/* =========================
   ITEMS
========================= */

.item {
    display: grid;
    grid-template-columns: 1fr 130px 120px auto;
    gap: 10px;
    align-items: center;
    padding: 12px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    margin-bottom: 8px;
    background: #fafafa;
}

.item-name {
    font-weight: 600;
}

.cost {
    font-weight: 600;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
}

.good {
    background: #dcfce7;
    color: #166534;
}

.repair {
    background: #fef3c7;
    color: #92400e;
}

.replace {
    background: #fee2e2;
    color: #991b1b;
}

.pending {
    background: #e0e7ff;
    color: #3730a3;
}

.item-actions {
    display: flex;
    gap: 5px;
}

/* =========================
   EDIT MODE
========================= */

.edit-box {
    display: grid;
    grid-template-columns: 1fr 140px 140px auto;
    gap: 8px;
    width: 100%;
}

.edit-box input,
.edit-box select {
    padding: 9px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 600px;
    border-radius: 16px;
    padding: 25px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-content h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
}

/* =========================
   EMPTY
========================= */

.empty {
    text-align: center;
    padding: 50px;
    color: #64748b;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 1000px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .item {
        grid-template-columns: 1fr 100px 110px;
    }

    .item-actions {
        grid-column: 1 / -1;
    }

    .edit-box {
        grid-template-columns: 1fr 1fr;
    }
}

@media(max-width: 600px) {
    header h1 {
        font-size: 22px;
    }

    .container {
        padding: 12px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .stat strong {
        font-size: 22px;
    }

    .villa-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .room-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .item {
        grid-template-columns: 1fr;
    }

    .edit-box {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🏠 Villa Management Dashboard</h1>
    <p>Manage villas, rooms, inventory, status and estimated replacement costs.</p>
</header>

<div class="container">

    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <h3>Total Villas</h3>
            <strong id="totalVillas">0</strong>
        </div>

        <div class="stat">
            <h3>Total Items</h3>
            <strong id="totalItems">0</strong>
        </div>

        <div class="stat">
            <h3>Good</h3>
            <strong id="goodItems">0</strong>
        </div>

        <div class="stat">
            <h3>Repair</h3>
            <strong id="repairItems">0</strong>
        </div>

        <div class="stat">
            <h3>Estimated Cost</h3>
            <strong id="totalCost">SAR 0</strong>
        </div>

    </div>

    <!-- CONTROLS -->

    <div class="controls">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔍 Search villa, room or item..."
            oninput="render()"
        >

        <div class="buttons">

            <button class="btn-dark" onclick="showAll()">
                All
            </button>

            <button class="btn-green" onclick="filterStatus('Good')">
                Good
            </button>

            <button class="btn-orange" onclick="filterStatus('Repair')">
                Repair
            </button>

            <button class="btn-red" onclick="filterStatus('Replace')">
                Replace
            </button>

            <button class="btn-blue" onclick="filterStatus('Pending')">
                Pending
            </button>

            <button class="btn-blue" onclick="addVilla()">
                + Add Villa
            </button>

            <button class="btn-green" onclick="saveData()">
                💾 Save Changes
            </button>

            <button class="btn-gray" onclick="backupData()">
                📥 Backup
            </button>

            <button class="btn-gray" onclick="restoreData()">
                📤 Restore
            </button>

        </div>

    </div>

    <div id="villaContainer"></div>

</div>


<!-- DETAILS MODAL -->

<div id="modal" class="modal" onclick="closeModal(event)">

    <div class="modal-content">

        <h2 id="modalTitle"></h2>

        <div id="modalBody"></div>

        <br>

        <button class="btn-gray" onclick="hideModal()">
            Close
        </button>

    </div>

</div>


<script>

/* =========================================================
   DEFAULT DATA
========================================================= */

const defaultVillas = [

    {
        id: "villa-1",
        name: "Villa 1",
        type: "Deluxe Villa",

        rooms: [

            {
                id: "room-1",
                name: "Living Room",

                items: [

                    {
                        id: "item-1",
                        name: "Sofa",
                        cost: 1500,
                        status: "Good"
                    },

                    {
                        id: "item-2",
                        name: "Coffee Table",
                        cost: 500,
                        status: "Good"
                    },

                    {
                        id: "item-3",
                        name: "TV",
                        cost: 2200,
                        status: "Repair"
                    }

                ]
            },

            {
                id: "room-2",
                name: "Bedroom 1",

                items: [

                    {
                        id: "item-4",
                        name: "Bed",
                        cost: 1800,
                        status: "Good"
                    },

                    {
                        id: "item-5",
                        name: "Wardrobe",
                        cost: 1200,
                        status: "Replace"
                    }

                ]
            }

        ]
    },

    {
        id: "villa-2",
        name: "Villa 2",
        type: "Junior Villa",

        rooms: [

            {
                id: "room-3",
                name: "Living Room",

                items: [

                    {
                        id: "item-6",
                        name: "Sofa",
                        cost: 1500,
                        status: "Good"
                    },

                    {
                        id: "item-7",
                        name: "TV",
                        cost: 2200,
                        status: "Pending"
                    }

                ]
            },

            {
                id: "room-4",
                name: "Bedroom",

                items: [

                    {
                        id: "item-8",
                        name: "Bed",
                        cost: 1800,
                        status: "Good"
                    }

                ]
            }

        ]
    }

];


/* =========================================================
   LOAD DATA
========================================================= */

let villas =
    JSON.parse(localStorage.getItem("villaData")) ||
    structuredClone(defaultVillas);

let currentFilter = "All";


/* =========================================================
   HELPERS
========================================================= */

function money(value) {

    return "SAR " + Number(value || 0).toLocaleString();

}


function generateId(prefix) {

    return prefix + "-" + Date.now() + "-" +
        Math.random().toString(36).substring(2, 8);

}


function allItems(villa) {

    let items = [];

    villa.rooms.forEach(room => {

        room.items.forEach(item => {

            items.push(item);

        });

    });

    return items;

}


function getStats() {

    let items = [];

    villas.forEach(villa => {

        items = items.concat(allItems(villa));

    });

    return {

        totalItems: items.length,

        good: items.filter(x => x.status === "Good").length,

        repair: items.filter(x => x.status === "Repair").length,

        replace: items.filter(x => x.status === "Replace").length,

        pending: items.filter(x => x.status === "Pending").length,

        cost: items.reduce(
            (sum, item) => sum + Number(item.cost || 0),
            0
        )

    };

}


function statusClass(status) {

    return status.toLowerCase();

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats() {

    const stats = getStats();

    document.getElementById("totalVillas").textContent =
        villas.length;

    document.getElementById("totalItems").textContent =
        stats.totalItems;

    document.getElementById("goodItems").textContent =
        stats.good;

    document.getElementById("repairItems").textContent =
        stats.repair;

    document.getElementById("totalCost").textContent =
        money(stats.cost);

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    updateStats();

    const container =
        document.getElementById("villaContainer");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    container.innerHTML = "";

    let visibleVillas = 0;

    villas.forEach(villa => {

        let villaMatches =
            villa.name.toLowerCase().includes(search) ||
            villa.type.toLowerCase().includes(search);

        let villaHTML = "";

        villa.rooms.forEach(room => {

            let roomMatches =
                room.name.toLowerCase().includes(search);

            let visibleItems = room.items.filter(item => {

                const searchMatch =
                    !search ||
                    villaMatches ||
                    roomMatches ||
                    item.name.toLowerCase().includes(search);

                const statusMatch =
                    currentFilter === "All" ||
                    item.status === currentFilter;

                return searchMatch && statusMatch;

            });

            if (visibleItems.length === 0) {
                return;
            }

            villaHTML += `

                <div class="room">

                    <div class="room-header">

                        <h3>
                            🛏️ ${escapeHTML(room.name)}
                        </h3>

                        <div>

                            <button
                                class="btn-blue"
                                onclick="addItem('${villa.id}','${room.id}')"
                            >
                                + Add Item
                            </button>

                            <button
                                class="btn-red"
                                onclick="deleteRoom('${villa.id}','${room.id}')"
                            >
                                Delete Room
                            </button>

                        </div>

                    </div>

                    ${visibleItems.map(item =>

                        itemHTML(
                            villa,
                            room,
                            item
                        )

                    ).join("")}

                </div>

            `;

        });


        if (villaHTML) {

            visibleVillas++;

            container.innerHTML += `

                <div class="villa">

                    <div class="villa-header">

                        <div>

                            <h2>
                                🏠 ${escapeHTML(villa.name)}
                            </h2>

                            <div class="villa-info">
                                ${escapeHTML(villa.type)}
                            </div>

                        </div>

                        <div class="villa-actions">

                            <button
                                class="btn-blue"
                                onclick="showDetails('${villa.id}')"
                            >
                                Details
                            </button>

                            <button
                                class="btn-green"
                                onclick="addRoom('${villa.id}')"
                            >
                                + Room
                            </button>

                            <button
                                class="btn-gray"
                                onclick="exportVilla('${villa.id}')"
                            >
                                Export
                            </button>

                            <button
                                class="btn-red"
                                onclick="deleteVilla('${villa.id}')"
                            >
                                Delete Villa
                            </button>

                        </div>

                    </div>

                    ${villaHTML}

                </div>

            `;

        }

    });


    if (visibleVillas === 0) {

        container.innerHTML = `

            <div class="empty">

                <h2>No results found</h2>

                <p>
                    Try another search or filter.
                </p>

            </div>

        `;

    }

}


/* =========================================================
   ITEM HTML
========================================================= */

function itemHTML(villa, room, item) {

    return `

        <div
            class="item"
            id="item-${item.id}"
            data-item-id="${item.id}"
        >

            <div class="item-name">

                ${escapeHTML(item.name)}

            </div>

            <div class="cost">

                ${money(item.cost)}

            </div>

            <div>

                <span class="badge ${statusClass(item.status)}">

                    ${escapeHTML(item.status)}

                </span>

            </div>

            <div class="item-actions">

                <button
                    class="btn-blue"
                    onclick="editItem(
                        '${villa.id}',
                        '${room.id}',
                        '${item.id}'
                    )"
                >
                    Edit
                </button>

                <button
                    class="btn-red"
                    onclick="deleteItem(
                        '${villa.id}',
                        '${room.id}',
                        '${item.id}'
                    )"
                >
                    Delete
                </button>

            </div>

        </div>

    `;

}


/* =========================================================
   EDIT ITEM
========================================================= */

function editItem(villaId, roomId, itemId) {

    const villa =
        villas.find(v => v.id === villaId);

    if (!villa) return;

    const room =
        villa.rooms.find(r => r.id === roomId);

    if (!room) return;

    const item =
        room.items.find(i => i.id === itemId);

    if (!item) return;

    const element =
        document.getElementById("item-" + itemId);

    if (!element) return;

    element.innerHTML = `

        <div class="edit-box">

            <input
                id="name-${itemId}"
                value="${escapeAttribute(item.name)}"
                placeholder="Item name"
            >

            <input
                id="cost-${itemId}"
                type="number"
                min="0"
                value="${Number(item.cost || 0)}"
                placeholder="Cost"
            >

            <select id="status-${itemId}">

                <option
                    value="Good"
                    ${item.status === "Good" ? "selected" : ""}
                >
                    Good
                </option>

                <option
                    value="Repair"
                    ${item.status === "Repair" ? "selected" : ""}
                >
                    Repair
                </option>

                <option
                    value="Replace"
                    ${item.status === "Replace" ? "selected" : ""}
                >
                    Replace
                </option>

                <option
                    value="Pending"
                    ${item.status === "Pending" ? "selected" : ""}
                >
                    Pending
                </option>

            </select>

            <div>

                <button
                    class="btn-green"
                    onclick="saveItem(
                        '${villaId}',
                        '${roomId}',
                        '${itemId}'
                    )"
                >
                    Save
                </button>

                <button
                    class="btn-gray"
                    onclick="render()"
                >
                    Cancel
                </button>

            </div>

        </div>

    `;

}


/* =========================================================
   SAVE ITEM
========================================================= */

function saveItem(villaId, roomId, itemId) {

    const villa =
        villas.find(v => v.id === villaId);

    if (!villa) return;

    const room =
        villa.rooms.find(r => r.id === roomId);

    if (!room) return;

    const item =
        room.items.find(i => i.id === itemId);

    if (!item) return;

    const name =
        document.getElementById("name-" + itemId).value.trim();

    const cost =
        Number(
            document.getElementById("cost-" + itemId).value
        );

    const status =
        document.getElementById("status-" + itemId).value;

    if (!name) {

        alert("Please enter an item name.");

        return;

    }

    item.name = name;

    item.cost = cost || 0;

    item.status = status;

    saveData(false);

    render();

}


/* =========================================================
   ADD ITEM
========================================================= */

function addItem(villaId, roomId) {

    const villa =
        villas.find(v => v.id === villaId);

    if (!villa) return;

    const room =
        villa.rooms.find(r => r.id === roomId);

    if (!room) return;

    const name =
        prompt("Enter item name:");

    if (!name || !name.trim()) {
        return;
    }

    const cost =
        prompt("Enter estimated cost in SAR:", "0");

    const status =
        prompt(
            "Enter status: Good, Repair, Replace or Pending",
            "Good"
        );

    const validStatuses =
        ["Good", "Repair", "Replace", "Pending"];

    let finalStatus =
        validStatuses.includes(status)
            ? status
            : "Good";

    room.items.push({

        id: generateId("item"),

        name: name.trim(),

        cost: Number(cost) || 0,

        status: finalStatus

    });

    saveData(false);

    render();

}


/* =========================================================
   DELETE ITEM
========================================================= */

function deleteItem(villaId, roomId, itemId) {

    if (!confirm("Delete this item?")) {
        return;
    }

    const villa =
        villas.find(v => v.id === villaId);

    if (!villa) return;

    const room =
        villa.rooms.find(r => r.id === roomId);

    if (!room) return;

    room.items =
        room.items.filter(
            item => item.id !== itemId
        );

    saveData(false);

    render();

}


/* =========================================================
   ADD ROOM
========================================================= */

function addRoom(villaId) {

    const villa =
        villas.find(v => v.id === villaId);

    if (!villa) return;

    const name =
        prompt("Enter room name:");

    if (!name || !name.trim()) {
        return;
    }

    villa.rooms.push({

        id: generateId("room"),

        name: name.trim(),

        items: []

    });

    saveData(false);

    render();

}


/* =========================================================
   DELETE ROOM
========================================================= */

function deleteRoom(villaId, roomId) {

    if (!confirm(
        "Delete this room and all its items?"
    )) {
        return;
    }

    const villa =
        villas.find(v => v.id === villaId);

    if (!villa) return;

    villa.rooms =
        villa.rooms.filter(
            room => room.id !== roomId
        );

    saveData(false);

    render();

}


/* =========================================================
   ADD VILLA
========================================================= */

function addVilla() {

    const name =
        prompt(
            "Enter villa name:",
            "Villa " + (villas.length + 1)
        );

    if (!name || !name.trim()) {
        return;
    }

    const type =
        prompt(
            "Enter villa type:",
            "Deluxe Villa"
        );

    villas.push({

        id: generateId("villa"),

        name: name.trim(),

        type: type && type.trim()
            ? type.trim()
            : "Villa",

        rooms: [

            {

                id: generateId("room"),

                name: "Living Room",

                items: []

            }

        ]

    });

    saveData(false);

    render();

}


/* =========================================================
   DELETE VILLA
========================================================= */

function deleteVilla(villaId) {

    const villa =
        villas.find(v => v.id === villaId);

    if (!villa) return;

    if (!confirm(
        "Delete " +
        villa.name +
        " and ALL rooms/items inside it?"
    )) {

        return;

    }

    villas =
        villas.filter(
            villa => villa.id !== villaId
        );

    saveData(false);

    render();

}


/* =========================================================
   FILTER
========================================================= */

function filterStatus(status) {

    currentFilter = status;

    render();

}


function showAll() {

    currentFilter = "All";

    render();

}


/* =========================================================
   SAVE
========================================================= */

function saveData(showMessage = true) {

    localStorage.setItem(
        "villaData",
        JSON.stringify(villas)
    );

    if (showMessage) {

        alert(
            "Changes saved successfully on this device."
        );

    }

}


/* =========================================================
   BACKUP DATA
========================================================= */

function backupData() {

    const data =
        JSON.stringify(villas, null, 2);

    const blob =
        new Blob(
            [data],
            {
                type: "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "villa-management-backup.json";

    a.click();

    URL.revokeObjectURL(url);

}


/* =========================================================
   RESTORE DATA
========================================================= */

function restoreData() {

    const input =
        document.createElement("input");

    input.type = "file";

    input.accept = ".json";

    input.onchange = function(event) {

        const file =
            event.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload = function(e) {

            try {

                const imported =
                    JSON.parse(e.target.result);

                if (!Array.isArray(imported)) {

                    throw new Error();

                }

                villas = imported;

                saveData(false);

                render();

                alert(
                    "Backup restored successfully."
                );

            }

            catch {

                alert(
                    "Invalid backup file."
                );

            }

        };

        reader.readAsText(file);

    };

    input.click();

}


/* =========================================================
   DETAILS
========================================================= */

function showDetails(villaId) {

    const villa =
        villas.find(v => v.id === villaId);

    if (!villa) return;

    const items =
        allItems(villa);

    const totalCost =
        items.reduce(
            (sum, item) =>
                sum + Number(item.cost || 0),
            0
        );

    document.getElementById("modalTitle")
        .textContent =
        villa.name;

    document.getElementById("modalBody")
        .innerHTML = `

            <p>
                <strong>Type:</strong>
                ${escapeHTML(villa.type)}
            </p>

            <p>
                <strong>Rooms:</strong>
                ${villa.rooms.length}
            </p>

            <p>
                <strong>Total Items:</strong>
                ${items.length}
            </p>

            <p>
                <strong>Estimated Cost:</strong>
                ${money(totalCost)}
            </p>

            <hr>

            ${villa.rooms.map(room => `

                <h3>
                    ${escapeHTML(room.name)}
                </h3>

                <ul>

                    ${room.items.map(item => `

                        <li>
                            ${escapeHTML(item.name)}
                            —
                            ${money(item.cost)}
                            —
                            <strong>
                                ${escapeHTML(item.status)}
                            </strong>
                        </li>

                    `).join("")}

                </ul>

            `).join("")}

        `;

    document.getElementById("modal")
        .style.display = "flex";

}


/* =========================================================
   MODAL
========================================================= */

function hideModal() {

    document.getElementById("modal")
        .style.display = "none";

}


function closeModal(event) {

    if (event.target.id === "modal") {

        hideModal();

    }

}


/* =========================================================
   EXPORT VILLA
========================================================= */

function exportVilla(villaId) {

    const villa =
        villas.find(v => v.id === villaId);

    if (!villa) return;

    let report = "";

    report +=
        "VILLA MANAGEMENT REPORT\n";

    report +=
        "========================\n\n";

    report +=
        "Villa: " +
        villa.name +
        "\n";

    report +=
        "Type: " +
        villa.type +
        "\n\n";

    villa.rooms.forEach(room => {

        report +=
            "\nROOM: " +
            room.name +
            "\n";

        report +=
            "------------------------\n";

        room.items.forEach(item => {

            report +=
                item.name +
                " | " +
                item.status +
                " | " +
                money(item.cost) +
                "\n";

        });

    });

    const items =
        allItems(villa);

    const total =
        items.reduce(
            (sum, item) =>
                sum + Number(item.cost || 0),
            0
        );

    report +=
        "\nTOTAL ESTIMATED COST: " +
        money(total) +
        "\n";

    const blob =
        new Blob(
            [report],
            {
                type: "text/plain"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        villa.name.replace(/\s+/g, "-") +
        "-report.txt";

    a.click();

    URL.revokeObjectURL(url);

}


/* =========================================================
   SECURITY / HTML HELPERS
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* =========================================================
   START APP
========================================================= */

render();

</script>
